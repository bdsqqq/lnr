name: Read-only exact-project inspection

on:
  pull_request:
    branches: ["feat/api-parity-nested-input-witnesses"]

permissions:
  contents: read

jobs:
  inspect-exact-project:
    if: github.head_ref == 'chore/read-only-project-recovery' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: lnr-e2e-bdsqqq-sandbox
      cancel-in-progress: false
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - run: bun install --frozen-lockfile
      - run: bun test scripts/inspect-project-recovery.test.ts
      - name: Inspect only the authorized exact project name
        run: bun scripts/inspect-project-recovery.ts
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LNR_RECOVERY_CONFIRM_ORG: bdsqqq-sandbox
