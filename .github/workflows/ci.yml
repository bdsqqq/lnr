name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate SKILL.md frontmatter
        run: ./scripts/validate-frontmatter.sh

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - run: bun install
      - run: bun run check
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - run: bun install
      - run: bun test packages/cli/src/e2e-readonly.test.ts
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      - run: bun test packages/cli/src/e2e-mutations.test.ts
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LNR_E2E_CONFIRM_ORG: bdsqqq-sandbox
